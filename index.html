<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Center Audit Hub</title>
<meta name="description" content="Chughtai Healthcare — Center Audit Hub">
<meta name="theme-color" content="#2F3690">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Audit Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --brand:#2F3690; --brand-ink:#FFFFFF; --soft:#C9CCF0; }
  html, body { margin:0; height:100%; background:var(--brand); color:var(--brand-ink);
    font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:var(--brand); text-align:center; padding:24px; box-sizing:border-box; transition:opacity .35s ease; z-index:2; }
  #splash.gone { opacity:0; pointer-events:none; }
  #splash img { width:112px; height:112px; border-radius:22px; box-shadow:0 8px 28px rgba(0,0,0,.25); }
  #splash h1 { margin:0; font-size:20px; font-weight:600; letter-spacing:.2px; }
  #splash p { margin:0; color:var(--soft); max-width:30ch; }
  .bar { width:140px; height:3px; border-radius:3px; background:rgba(255,255,255,.18); overflow:hidden; }
  .bar i { display:block; width:40%; height:100%; background:#fff; border-radius:3px; animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform:translateX(-100%) } 100% { transform:translateX(250%) } }
  @media (prefers-reduced-motion: reduce) { .bar i { animation:none; width:100% } }
  #help { display:none; flex-direction:column; gap:10px; align-items:center; }
  #help.on { display:flex; }
  a.btn, button.btn { appearance:none; border:1px solid rgba(255,255,255,.5); background:#fff; color:var(--brand); font:inherit; font-weight:600;
    padding:10px 18px; border-radius:10px; text-decoration:none; cursor:pointer; }
  a.ghost { background:transparent; color:#fff; }
  a.btn:focus-visible, button.btn:focus-visible { outline:3px solid #FFD966; outline-offset:2px; }
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite">
  <img src="icon-192.png" alt="Chughtai Healthcare">
  <h1>Center Audit Hub</h1>
  <p id="msg">Opening the audit portal…</p>
  <div class="bar" id="bar"><i></i></div>
  <div id="help">
    <p>Taking long? Sign in with your cll.edu.pk Google account, then open again.</p>
    <a class="btn" id="direct" href="#">Sign in &amp; open</a>
    <button class="btn" id="retry" type="button">Try again</button>
  </div>
</div>
<script>
  /* The live portal (Google Apps Script web app, cll.edu.pk accounts only). It opens as a full page so that
     Google sign-in works on every phone; the app window, icon and name stay the app's own. */
  const HUB = "https://script.google.com/a/macros/cll.edu.pk/s/AKfycbyGhgHN6vf32kukGmyGQryYkDVPeXRTXmiCCkClWC6NnJnkh0BA7nF8ooBJX9DfL7ggzw/exec";
  const help = document.getElementById("help"), msg = document.getElementById("msg"), bar = document.getElementById("bar");
  document.getElementById("direct").href = HUB;
  function load(){
    if (!navigator.onLine){ msg.textContent = "No internet connection. Connect and tap Try again."; bar.style.display = "none"; help.classList.add("on"); return; }
    msg.textContent = "Opening the audit portal…"; bar.style.display = ""; help.classList.remove("on");
    setTimeout(() => location.replace(HUB), 350);
    setTimeout(() => help.classList.add("on"), 12000);
  }
  document.getElementById("retry").onclick = load;
  window.addEventListener("online", load);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  load();
</script>
</body>
</html>
